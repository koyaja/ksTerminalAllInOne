# Publie une release GitHub dès que la version de package.json change sur main
# (ou à la main : Actions ▸ Release ▸ Run workflow).
#   · Windows : KSTermus-win-x64-<v>.zip (+ update.json signé si le secret existe)
#   · Linux   : .deb, .AppImage, .tar.gz
#   · macOS   : .dmg et .zip pour Apple Silicon (arm64) et Intel (x64), signature ad-hoc
# Secret optionnel KSTERMUS_SIGNING_KEY = contenu de kstermus-update-signing.pem.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

  build-linux-windows:
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Dépendances
        run: |
          npm ci
          npm pack @lydell/node-pty-win32-x64@1.2.0-beta.15
          mkdir -p node_modules/@lydell/node-pty-win32-x64
          tar xzf lydell-node-pty-win32-x64-*.tgz -C node_modules/@lydell/node-pty-win32-x64 --strip-components=1
      - name: Contrôle des modules
        run: node -e "for (const m of ['vault','vpn','lock','updater','hello','sync','gdrive','audit','sftp-jobs']) require('./src/main/' + m); console.log('modules OK')"
      - name: Build Linux
        run: npm run dist:linux
      - name: Build Windows
        run: |
          npm run dist:dir
          rm -rf dist/pkg && mkdir -p dist/pkg && cp -r dist/win-unpacked dist/pkg/KSTermus
          (cd dist/pkg && zip -qr -9 ../KSTermus-win-x64.zip KSTermus)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-windows
          path: |
            dist/KSTermus-win-x64.zip
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error

  build-macos:
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Dépendances (PTY macOS arm64 + x64)
        run: |
          npm ci
          for a in arm64 x64; do
            if [ ! -d node_modules/@lydell/node-pty-darwin-$a ]; then
              npm pack @lydell/node-pty-darwin-$a@1.2.0-beta.15
              mkdir -p node_modules/@lydell/node-pty-darwin-$a
              tar xzf lydell-node-pty-darwin-$a-*.tgz -C node_modules/@lydell/node-pty-darwin-$a --strip-components=1
            fi
          done
      - name: Contrôle des modules
        run: node -e "for (const m of ['vault','vpn','lock','updater','sync','gdrive','audit','sftp-jobs']) require('./src/main/' + m); console.log('modules OK')"
      - name: Build macOS (dmg + zip, arm64 + x64)
        run: npm run dist:mac
      - name: Vérification de la signature
        run: |
          for app in dist/mac*/KSTermus.app; do codesign --verify --deep --strict "$app" && echo "OK $app"; done
          ls -la dist/*.dmg dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/KSTermus-*-mac-*.zip
          if-no-files-found: error

  publish:
    needs: [prepare, build-linux-windows, build-macos]
    # Si le Mac n'est pas disponible, on publie quand même Windows / Linux ;
    # le job « add-macos » ajoutera les fichiers Mac à la release plus tard.
    if: always() && needs.prepare.outputs.exists == 'false' && needs.build-linux-windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Notes de version
        run: |
          V=${{ needs.prepare.outputs.version }}
          LINE=$(grep -F "| **$V** |" README.md | head -1 | sed -E 's/^\| \*\*[^*]+\*\* \| //; s/ \|$//')
          {
            echo "${LINE:-KSTermus $V}"
            echo
            echo "**Windows** : mise à jour automatique depuis l'application, ou extraire \`KSTermus-win-x64-$V.zip\` dans \`%LOCALAPPDATA%\\Programs\\\`."
            echo "**Linux** : \`sudo apt install ./kstermus_${V}_amd64.deb\`, ou l'AppImage, ou le .tar.gz."
            echo "**macOS** : \`KSTermus-$V-mac-arm64.dmg\` (Apple Silicon M1–M4) ou \`-mac-x64.dmg\` (Intel). Première ouverture : clic droit ▸ Ouvrir (application non notariée), ou \`xattr -dr com.apple.quarantine /Applications/KSTermus.app\`."
          } > notes.md
          cat notes.md
      - name: Signer la mise à jour Windows
        env:
          KEY: ${{ secrets.KSTERMUS_SIGNING_KEY }}
        run: |
          V=${{ needs.prepare.outputs.version }}
          ZIP=artifacts/linux-windows/KSTermus-win-x64.zip
          if [ -n "$KEY" ]; then
            umask 077; printf '%s\n' "$KEY" > "$RUNNER_TEMP/k.pem"
            node scripts/make-release.js --zip "$ZIP" --notes notes.md --key "$RUNNER_TEMP/k.pem"
            rm -f "$RUNNER_TEMP/k.pem"
          else
            echo "::warning::Secret KSTERMUS_SIGNING_KEY absent : pas d'update.json."
            mkdir -p dist/release && cp "$ZIP" "dist/release/KSTermus-win-x64-$V.zip"
          fi
          rm -f dist/release/notes.md
          cp artifacts/linux-windows/*.deb artifacts/linux-windows/*.AppImage artifacts/linux-windows/*.tar.gz dist/release/
          if [ -d artifacts/macos ]; then cp artifacts/macos/* dist/release/; else echo "::warning::Pas de build macOS dans cette exécution"; fi
          (cd dist/release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ needs.prepare.outputs.version }}
          gh release create "v$V" dist/release/* --title "KSTermus $V" --notes-file notes.md --target "$GITHUB_SHA"

  sign-existing:
    runs-on: ubuntu-latest
    needs: [prepare, publish]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Signer la release existante
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ secrets.KSTERMUS_SIGNING_KEY }}
        run: |
          V=$(node -p "require('./package.json').version")
          gh release view "v$V" >/dev/null 2>&1 || { echo "Pas de release v$V"; exit 0; }
          if gh release view "v$V" --json assets -q '.assets[].name' | grep -qx update.json; then echo "update.json déjà présent"; exit 0; fi
          [ -n "$KEY" ] || { echo "::warning::Secret KSTERMUS_SIGNING_KEY absent"; exit 0; }
          mkdir -p "$RUNNER_TEMP/rel" && gh release download "v$V" -p "KSTermus-win-x64-$V.zip" -D "$RUNNER_TEMP/rel"
          gh release view "v$V" --json body -q .body > "$RUNNER_TEMP/notes.md"
          umask 077; printf '%s\n' "$KEY" > "$RUNNER_TEMP/k.pem"
          node scripts/make-release.js --zip "$RUNNER_TEMP/rel/KSTermus-win-x64-$V.zip" --notes "$RUNNER_TEMP/notes.md" --key "$RUNNER_TEMP/k.pem"
          rm -f "$RUNNER_TEMP/k.pem"
          cmp "$RUNNER_TEMP/rel/KSTermus-win-x64-$V.zip" "dist/release/KSTermus-win-x64-$V.zip"
          gh release upload "v$V" dist/release/update.json
          echo "update.json ajouté à v$V"

  # Release déjà publiée sans les fichiers macOS (Mac indisponible au moment du build) :
  # construit sur un Mac et ajoute .dmg / .zip + met à jour SHA256SUMS.
  add-macos:
    needs: [prepare, publish]
    if: always() && needs.prepare.outputs.exists == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Déjà présents ?
        id: chk
        run: |
          V=${{ needs.prepare.outputs.version }}
          if gh release view "v$V" --json assets -q '.assets[].name' | grep -q -- '-mac-'; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.skip == 'false'
        with: { node-version: 22, cache: npm }
      - name: Build macOS
        if: steps.chk.outputs.skip == 'false'
        run: |
          npm ci
          for a in arm64 x64; do
            if [ ! -d node_modules/@lydell/node-pty-darwin-$a ]; then
              npm pack @lydell/node-pty-darwin-$a@1.2.0-beta.15
              mkdir -p node_modules/@lydell/node-pty-darwin-$a
              tar xzf lydell-node-pty-darwin-$a-*.tgz -C node_modules/@lydell/node-pty-darwin-$a --strip-components=1
            fi
          done
          npm run dist:mac
          for app in dist/mac*/KSTermus.app; do codesign --verify --deep --strict "$app" && echo "OK $app"; done
      - name: Ajouter à la release
        if: steps.chk.outputs.skip == 'false'
        run: |
          V=${{ needs.prepare.outputs.version }}
          mkdir -p rel && cd rel
          gh release download "v$V" -p SHA256SUMS.txt
          cp ../dist/*.dmg ../dist/KSTermus-*-mac-*.zip .
          shasum -a 256 *.dmg KSTermus-*-mac-*.zip >> SHA256SUMS.txt
          gh release upload "v$V" *.dmg KSTermus-*-mac-*.zip
          gh release upload "v$V" SHA256SUMS.txt --clobber
